<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f1ed" />
    <script>
      // Set the theme before first paint so there is no light flash in dark mode.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = t === "dark" ? "#0d0d0c" : "#f2f1ed";
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Rasya Putra — Information Systems student and Data Analyst Intern building dashboards, web tools, and mobile apps."
    />
    <title>Rasya Putra — Data Analyst & Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.jsx"></script>
  </body>
</html>
